
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Details | Dadmehr Academy</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="resources.css">
</head>
<body>

<header class="header">
  <a href="index.html" class="brand">
    <img src="image/logo.jpeg"Dadmehr Academy">
  </a>
  <nav>
    <a href="index.html">Home</a>
    <a href="resources.html" class="active">Learning Resources</a>
    <a href="gallery.html">Gallery</a>
  </nav>
</header>

<main class="page-container">
  <a href="resources.html" class="back-link">← Learning Resources</a>
  <section id="bookDetails"></section>
</main>

<footer class="footer">
  <p>© 2026 Dadmehr Academy. All Rights Reserved.</p>
</footer>

<script src="resources.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const book = getBookById(params.get("id"));
  const container = document.getElementById("bookDetails");

  if (!book) {
    container.innerHTML = "<h2>Book Not Found</h2>";
  } else {
    document.title = book.title + " | Dadmehr Academy";

    container.innerHTML = `
      <div class="book-detail-layout">
        <div class="detail-cover">
          <img src="${book.cover}" alt="${book.title}">
        </div>

        <div class="detail-content">
          <span class="eyebrow">DADMEHR ACADEMY</span>
          <h1>${book.title}</h1>
          <p class="detail-description">${book.description}</p>

          <div class="detail-meta">
            <p><strong>Learning Level:</strong> ${book.level}</p>
          </div>

          <div class="book-actions">
            <a class="action-button primary"
               href="${book.pdf}" target="_blank" rel="noopener">
              View PDF
            </a>
            <a class="action-button secondary"
               href="${book.pdf}" download>
              Download PDF
            </a>
          </div>
        </div>
      </div>
    `;
  }
</script>

</body>
</html>
